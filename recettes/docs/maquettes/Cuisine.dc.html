<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Mode cuisine</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@500;700&amp;family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600&amp;family=IBM+Plex+Mono:wght@500&amp;display=swap">
<style>
body{margin:0}
a{color:#e3ecf6;text-decoration:none}a:hover{color:#ffffff}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #16202b; color: #eef2f5; font-family: Literata, Georgia, serif; display: flex; flex-direction: column; padding: 56px 22px 34px; gap: 22px">
  <div style="display: flex; align-items: center; justify-content: space-between">
    <a href="Recette.dc.html" aria-label="Quitter le mode cuisine" style="width: 44px; height: 44px; border-radius: 50%; background: #243241; display: flex; align-items: center; justify-content: center">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#eef2f5" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"></path></svg>
    </a>
    <span style="font: 500 12px/1 'IBM Plex Mono', monospace; letter-spacing: 0.08em; text-transform: uppercase; color: #9aa6b1">Écran toujours allumé</span>
  </div>

  <div style="display: flex; flex-direction: column; gap: 8px">
    <span style="font: 500 13px/1 'IBM Plex Mono', monospace; color: #8db8e6">Étape {{step}} sur 4</span>
    <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px">
      <sc-for list="{{bars}}" as="bar" hint-placeholder-count="4">
        <div style="{{bar.style}}"></div>
      </sc-for>
    </div>
  </div>

  <p style="margin: 0; flex: 1; font: 400 27px/1.45 Literata, serif; white-space: pre-line">{{text}}</p>

  <div style="background: #1f2b38; border-radius: 16px; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px">
    <span style="font: 500 11px/1 'IBM Plex Mono', monospace; letter-spacing: 0.08em; text-transform: uppercase; color: #9aa6b1">Pour cette étape</span>
    <label for="ing1" style="display: flex; align-items: center; gap: 12px; font-size: 17px"><input id="ing1" type="checkbox" checked style="width: 22px; height: 22px; accent-color: #8db8e6">125 g de beurre demi-sel</label>
    <label for="ing2" style="display: flex; align-items: center; gap: 12px; font-size: 17px"><input id="ing2" type="checkbox" style="width: 22px; height: 22px; accent-color: #8db8e6">150 g de cassonade</label>
  </div>

  <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px">
    <button onClick="{{prev}}" style="height: 60px; border: 0; border-radius: 16px; background: #243241; color: #eef2f5; font: 700 17px/1 'Familjen Grotesk', sans-serif">Précédente</button>
    <button onClick="{{next}}" style="height: 60px; border: 0; border-radius: 16px; background: #8db8e6; color: #16202b; font: 700 17px/1 'Familjen Grotesk', sans-serif">Suivante</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { step: 2 };
  }
  renderVals() {
    const steps = [
      'Préchauffer le four à 180 °C.\nConcasser le chocolat en pépites.',
      'Mélanger le beurre bien mou avec la cassonade, jusqu’à obtenir une crème.',
      'Ajouter l’œuf, puis la farine petit à petit, et enfin le chocolat.',
      'Former des boules, les espacer sur la plaque et cuire 10 minutes.\nNe pas trop cuire !',
    ];
    const step = this.state.step;
    const bars = steps.map((_, i) => ({
      style: 'height: 6px; border-radius: 3px; background: ' + (i < step ? '#8db8e6' : '#2c3a4a'),
    }));
    return {
      step,
      bars,
      text: steps[step - 1],
      prev: () => this.setState({ step: Math.max(1, step - 1) }),
      next: () => this.setState({ step: Math.min(steps.length, step + 1) }),
    };
  }
}
</script>
</body>
</html>
