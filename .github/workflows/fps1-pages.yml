# Publie FPS1 sur GitHub Pages (https://leochartrain.github.io/projets/) à chaque
# push qui touche FPS1/. À activer une fois : Settings → Pages → Source : « GitHub Actions ».
name: FPS1 sur GitHub Pages

on:
  push:
    branches: [main]
    paths: ['FPS1/**', '.github/workflows/fps1-pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: FPS1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: FPS1/package-lock.json
      - run: npm ci
      # Le site est servi sous /projets/ : les fichiers du jeu doivent le savoir.
      - run: npm run build
        env:
          VITE_BASE: /projets/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: FPS1/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
